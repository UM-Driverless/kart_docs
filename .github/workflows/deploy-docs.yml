name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Export draw.io diagrams (PNG + SVG)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/data -w /data rlespinasse/drawio-export -f png -o . --remove-page-suffix docs
          docker run --rm -v "$GITHUB_WORKSPACE":/data -w /data rlespinasse/drawio-export -f svg -o . --remove-page-suffix --embed-svg-images docs

      - name: Validate exported SVGs have no local file URLs
        run: |
          # If draw.io-export can't resolve image paths, it may emit file:///... URLs in SVGs.
          # Those will be broken on GitHub Pages, so fail the build early.
          if grep -R --line-number "file:///" docs --include='*.svg'; then
            echo "::error::Found file:/// URLs in exported SVG(s). Fix the .drawio image references (prefer embedded data: URLs)."
            exit 1
          fi

      - name: Build MkDocs site
        run: |
          uv run mkdocs build --strict --verbose

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
