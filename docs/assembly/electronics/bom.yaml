  - id: "esp32_s3"
    part_number: "ESP32-S3-WROOM-1-N16R8"
    description: "ESP32-S3 microcontroller module (16 MB flash, 8 MB octal PSRAM) — MCU of the Kart Medulla interface PCB"
    category: "microcontroller"
    quantity: 1
    unit_cost: 5.00
    currency: "EUR"
    status: "active"
    criticality: "essential"
    suppliers:
      - name: "Mouser"
        url: "https://www.mouser.com/c/?q=ESP32-S3-WROOM-1-N16R8"
        verified: false
      - name: "AliExpress"
        url: "https://www.aliexpress.com/w/wholesale-ESP32-S3-WROOM-1-N16R8.html"
        verified: false
    specifications:
      voltage: "3.3V"
      temperature_range: "-40°C to +85°C"
      flash: "16 MB"
      psram: "8 MB (octal SPI — consumes GPIO 33-37 inside the module)"
      ram: "512 KB SRAM"
      cpu: "Xtensa dual-core 32-bit LX7"
      clock_speed: "up to 240 MHz"
      wifi: "802.11 b/g/n"
      bluetooth: "BLE 5"
      gpios: 45
      adcs: "2x 12-bit, multi-channel"
      dacs: "none (external MCP4922 dual 12-bit SPI DAC used instead)"
      usb: "native USB-OTG + USB-Serial-JTAG"
      interfaces: "SPI, I2C, UART, CAN (TWAI), I2S"
    alternatives:
      - "ESP32-S3-WROOM-1-N16R2 (16 MB flash, 2 MB quad PSRAM) — drop-in. Quad PSRAM shares the QSPI flash bus, so it FREES GPIO 33-37 rather than consuming them. No pinout change."
      - "ESP32-S3-WROOM-1-N8R2 (8 MB flash, 2 MB quad PSRAM) — drop-in, was the specified part until 2026-07-30. Also frees GPIO 33-37. Only choose it over N16R2 if 8 MB of flash is enough."
      - "ESP32-S2 (single-core, no BT)"
      - "ESP32-C6 (RISC-V, Wi-Fi 6)"
    notes: |
      MCU of the Kart Medulla interface PCB, the board installed in the kart. Pairs with an MCP4922 dual 12-bit SPI DAC for CMD_ACC and CMD_BRAKE.

      **GPIO 33-37 must never be assigned on this module.** The N16R8's 8 MB octal PSRAM die is
      hard-wired to those pins inside the module package, and Espressif's ESP32-S3-WROOM-1
      datasheet marks them as not available on R8 variants. This is physical, not a firmware
      setting: disabling PSRAM in sdkconfig does NOT reclaim the pins, because the die stays
      electrically attached to the traces.

      The current pinout already honours this - GPIO 33, 35, 36 and 37 are all HOLD, CMD_REVERSE
      sits on the U25 PCF8574 expander instead of GPIO 36, and MOTOR_HALL_1 was moved off GPIO 37
      to GPIO 16. So the octal PSRAM costs this design nothing today.

      Substituting a quad-PSRAM variant (N16R2 or N8R2) is safe and frees those five pins.
      The reverse - assigning GPIO 33-37 and then fitting an R8 - is what breaks.

      History: N8R2 was the specified part from 2026-04-23, with an explicit "never R8" rule.
      An N16R8 was fitted instead, the pinout proved R8-safe, and on 2026-07-30 the rule was
      retired rather than the module swapped. See history.md (repo root), 2026-04-23 and 2026-07-30.

