<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 920 1340" width="920" height="1340">
  <style>
    text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
    .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
    .subtitle { font-size: 12px; fill: #555; }
    .comp-box { fill: #f5f5f5; stroke: #333; stroke-width: 1.5; rx: 6; }
    .comp-box-valve { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 1.8; rx: 6; }
    .comp-box-actuator { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.8; rx: 6; }
    .comp-box-sensor { fill: #e6f4ea; stroke: #188038; stroke-width: 1.8; rx: 6; }
    .comp-box-shuttle { fill: #f3e5f5; stroke: #7b1fa2; stroke-width: 1.8; rx: 6; }
    .comp-label { font-size: 12px; font-weight: 600; fill: #222; text-anchor: middle; }
    .comp-detail { font-size: 10px; fill: #555; text-anchor: middle; }
    .ref-num { font-size: 11px; font-weight: bold; fill: #c5221f; text-anchor: middle; }
    .port-label { font-size: 9px; fill: #666; text-anchor: middle; }
    .tube { fill: none; stroke: #1a73e8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .tube-exhaust { fill: none; stroke: #999; stroke-width: 2; stroke-dasharray: 6,3; stroke-linecap: round; }
    .ck-fitting { fill: #fdd835; stroke: #f9a825; stroke-width: 1.5; }
    .ck-label { font-size: 8px; fill: #795548; text-anchor: middle; font-weight: 600; }
    .silencer { fill: #e0e0e0; stroke: #757575; stroke-width: 1.5; }
    .npfc-t { fill: #fff9c4; stroke: #f9a825; stroke-width: 2; }
    .legend-box { fill: #fafafa; stroke: #ccc; stroke-width: 1; rx: 4; }
    .note-box { fill: #fff3e0; stroke: #ff9800; stroke-width: 1; rx: 4; }
    a:hover .comp-box, a:hover .comp-box-valve, a:hover .comp-box-actuator,
    a:hover .comp-box-sensor, a:hover .comp-box-shuttle,
    a:hover .npfc-t, a:hover .silencer, g:hover > .comp-box {
      stroke-width: 3; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }
    a:hover .tube { stroke-width: 4; }
    a:hover .ck-fitting { stroke-width: 2.5; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.3)); }
    .comp-thumb { fill: #fff; stroke: #e0e0e0; stroke-width: 1; }
    a:hover .comp-thumb { stroke: #aaa; }
  </style>

  <rect width="920" height="1340" fill="#fefefe" rx="10"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" class="title">EBS Pneumatic Circuit &#8212; Validated Design</text>
  <text x="380" y="46" text-anchor="middle" class="subtitle">VPPM and EBS in parallel, merged by the OR/shuttle valve. No isolation valve in series with the VPPM. Physically validated 2026-05.</text>

  <!-- ===== LEGEND ===== -->
  <rect x="30" y="62" width="700" height="130" class="legend-box"/>
  <text x="50" y="87" style="font-size:13px;font-weight:bold;fill:#333;">Legend</text>

  <line x1="50" y1="107" x2="90" y2="107" class="tube"/>
  <text x="100" y="111" style="font-size:11px;fill:#444;">Pneumatic tube (PUN-H 6mm, 197384) &#8212; click to view</text>

  <circle cx="70" cy="129" r="5" class="ck-fitting"/>
  <text x="100" y="133" style="font-size:11px;fill:#444;">CK-1/4-PK-4 compression fitting (2029) &#8212; click to view</text>

  <rect x="58" y="145" width="20" height="14" class="npfc-t" rx="2"/>
  <text x="100" y="157" style="font-size:11px;fill:#444;">NPFC-T-3G14-F threaded T-adapter (8030236)</text>

  <text x="70" y="180" class="comp-detail" style="font-size:11px;text-anchor:start;">ref: 123456</text>
  <text x="140" y="180" style="font-size:11px;fill:#444;">= Manufacturer part number (click component to open product page)</text>

  <line x1="420" y1="105" x2="460" y2="105" class="tube-exhaust"/>
  <text x="470" y="109" style="font-size:11px;fill:#444;">Exhaust path</text>

  <rect x="432" y="121" width="16" height="12" class="silencer" rx="2"/>
  <text x="470" y="131" style="font-size:11px;fill:#444;">Silencer (2316 G1/4 or 2307 G1/8)</text>

  <rect x="428" y="144" width="24" height="14" class="comp-box-shuttle" style="stroke-width:1;" rx="2"/>
  <text x="470" y="156" style="font-size:11px;fill:#444;">OR / Shuttle valve</text>

  <text x="420" y="180" style="font-size:11px;fill:#444;font-style:italic;">All ports G1/4 unless noted. Tubing: 6mm OD / 4mm ID.</text>

  <g transform="translate(0,140)">
