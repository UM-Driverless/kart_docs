<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 720 1350" width="720" height="1350">
  <style>
    text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
    .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
    .subtitle { font-size: 12px; fill: #555; }
    .comp-box { fill: #f5f5f5; stroke: #333; stroke-width: 1.5; rx: 6; }
    .comp-box-valve { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 1.8; rx: 6; }
    .comp-box-actuator { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.8; rx: 6; }
    .comp-box-sensor { fill: #e6f4ea; stroke: #188038; stroke-width: 1.8; rx: 6; }
    .comp-label { font-size: 12px; font-weight: 600; fill: #222; text-anchor: middle; }
    .comp-detail { font-size: 10px; fill: #555; text-anchor: middle; }
    .ref-num { font-size: 11px; font-weight: bold; fill: #c5221f; text-anchor: middle; }
    .port-label { font-size: 9px; fill: #666; text-anchor: middle; }
    .tube { fill: none; stroke: #1a73e8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .tube-exhaust { fill: none; stroke: #999; stroke-width: 2; stroke-dasharray: 6,3; stroke-linecap: round; }
    .ck-fitting { fill: #fdd835; stroke: #f9a825; stroke-width: 1.5; }
    .ck-label { font-size: 8px; fill: #795548; text-anchor: middle; font-weight: 600; }
    .silencer { fill: #e0e0e0; stroke: #757575; stroke-width: 1.5; }
    .npfc-t { fill: #fff9c4; stroke: #f9a825; stroke-width: 2; }
    .legend-box { fill: #fafafa; stroke: #ccc; stroke-width: 1; rx: 4; }
    a:hover .comp-box, a:hover .comp-box-valve, a:hover .comp-box-actuator,
    a:hover .comp-box-sensor, a:hover .npfc-t, a:hover .silencer,
    g:hover > .comp-box {
      stroke-width: 3; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }
    a:hover .tube { stroke-width: 4; }
    a:hover .ck-fitting { stroke-width: 2.5; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.3)); }
  </style>

  <rect width="720" height="1350" fill="#fefefe" rx="10"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" class="title">EBS Pneumatic Circuit &#8212; Simplified Design</text>
  <text x="360" y="46" text-anchor="middle" class="subtitle">VPPM + EBS in parallel &#8594; actuator. No ASB valve, no OR valve.</text>

  <!-- ===== LEGEND ===== -->
  <rect x="30" y="62" width="660" height="115" class="legend-box"/>
  <text x="50" y="84" style="font-size:13px;font-weight:bold;fill:#333;">Legend</text>

  <line x1="50" y1="102" x2="90" y2="102" class="tube"/>
  <text x="100" y="106" style="font-size:11px;fill:#444;">Pneumatic tube (PUN-H 6mm, 197384) &#8212; click to view</text>

  <circle cx="70" cy="124" r="5" class="ck-fitting"/>
  <text x="100" y="128" style="font-size:11px;fill:#444;">CK-1/4-PK-4 compression fitting (2029) &#8212; click to view</text>

  <rect x="58" y="140" width="20" height="14" class="npfc-t" rx="2"/>
  <text x="100" y="152" style="font-size:11px;fill:#444;">NPFC-T-3G14-F threaded T-adapter (8030236)</text>

  <text x="70" y="174" class="comp-detail" style="font-size:11px;text-anchor:start;">ref: 123456</text>
  <text x="140" y="174" style="font-size:11px;fill:#444;">= Manufacturer part number (click component to open product page)</text>

  <line x1="400" y1="100" x2="440" y2="100" class="tube-exhaust"/>
  <text x="450" y="104" style="font-size:11px;fill:#444;">Exhaust path</text>

  <rect x="412" y="116" width="16" height="12" class="silencer" rx="2"/>
  <text x="450" y="126" style="font-size:11px;fill:#444;">Silencer (2316 G1/4 or 2307 G1/8)</text>

  <text x="400" y="152" style="font-size:11px;fill:#444;font-style:italic;">All ports G1/4 unless noted. Tubing: 6mm OD / 4mm ID.</text>

  <g transform="translate(0,130)">
  <!-- ===== SUPPLY CHAIN (vertical, centered at x=360) ===== -->

  <!-- Compressor + Tank -->
  <g>
    <rect x="285" y="70" width="150" height="55" class="comp-box"/>
    <text x="360" y="93" class="comp-label">Compressor + Tank</text>
    <text x="360" y="107" class="comp-detail">VEVOR 12V, 6L, 90-120 psi</text>
  </g>

  <!-- Tube down + CK -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank"><line x1="360" y1="125" x2="360" y2="165" class="tube"/></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="360" cy="125" r="5" class="ck-fitting"/><text x="375" y="129" class="ck-label">CK</text></a>

  <!-- PS1 -->
  <a xlink:href="https://www.festo.com/es/es/a/567465/" target="_blank">
    <rect x="285" y="165" width="150" height="50" class="comp-box-sensor"/>
    <text x="360" y="185" class="comp-label">Pressure Sensor</text>
    <text x="360" y="198" class="comp-detail">(tank side) SDE5, 0-10 bar</text>
    <text x="360" y="211" class="comp-detail">ref: 567465</text>
  </a>

  <!-- Tube down + CK -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank"><line x1="360" y1="215" x2="360" y2="255" class="tube"/></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="360" cy="255" r="5" class="ck-fitting"/><text x="375" y="259" class="ck-label">CK</text></a>

  <!-- Manual Valve -->
  <g>
    <rect x="295" y="255" width="130" height="45" class="comp-box"/>
    <text x="360" y="275" class="comp-label">Manual Valve</text>
    <text x="360" y="288" class="comp-detail">(manual isolation)</text>
  </g>

  <!-- Direct mount (integrated O-ring, no tube/fittings) -->
  <line x1="360" y1="300" x2="360" y2="340" stroke="#999" stroke-width="1.5"/>
  <text x="380" y="324" style="font-size:8px;fill:#777;font-style:italic;">direct (O-ring)</text>

  <!-- Regulator -->
  <a xlink:href="https://www.festo.com/es/es/a/527690/" target="_blank">
    <rect x="275" y="340" width="170" height="72" class="comp-box"/>
    <text x="360" y="358" class="comp-label">Regulator</text>
    <text x="360" y="372" class="comp-detail">MS4-LR-1/4-D7-AD10, 0.5-12 bar</text>
    <text x="360" y="388" class="comp-detail">&#9888; Never set above 10 bar</text>
    <text x="360" y="402" class="comp-detail">ref: 527690</text>
  </a>

  <!-- Tube down + CK -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank"><line x1="360" y1="412" x2="360" y2="452" class="tube"/></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="360" cy="412" r="5" class="ck-fitting"/><text x="375" y="416" class="ck-label">CK</text></a>

  <!-- PS2 -->
  <a xlink:href="https://www.festo.com/es/es/a/567465/" target="_blank">
    <rect x="285" y="452" width="150" height="50" class="comp-box-sensor"/>
    <text x="360" y="472" class="comp-label">Pressure Sensor</text>
    <text x="360" y="485" class="comp-detail">(regulated) SDE5, 0-10 bar</text>
    <text x="360" y="498" class="comp-detail">ref: 567465</text>
  </a>

  <!-- Tube down -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank"><line x1="360" y1="502" x2="360" y2="537" class="tube"/></a>

  <!-- ===== NPFC-T SPLIT ===== -->
  <a xlink:href="https://www.festo.com/es/es/a/8030236/" target="_blank">
    <rect x="325" y="537" width="70" height="55" class="npfc-t" rx="6"/>
    <text x="360" y="555" class="comp-label" style="font-size:11px">NPFC-T</text>
    <text x="360" y="568" class="comp-detail">3&#215;G1/4</text>
    <text x="360" y="580" class="comp-detail" style="font-size:9px;">ref: 8030236</text>
  </a>
  <!-- CK on each NPFC-T port -->
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="335" cy="592" r="4" class="ck-fitting"/><text x="320" y="602" class="ck-label">CK</text></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="385" cy="592" r="4" class="ck-fitting"/><text x="400" y="602" class="ck-label">CK</text></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="360" cy="537" r="4" class="ck-fitting"/></a>

  <!-- ===== PARALLEL PATHS ===== -->

  <!-- Tube: split left to VPPM -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <polyline points="335,592 335,619 200,619 200,657" class="tube"/>
  </a>
  <!-- Tube: split right to EBS -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <polyline points="385,592 385,619 520,619 520,657" class="tube"/>
  </a>

  <!-- VPPM (left column, x=200) -->
  <a xlink:href="https://www.festo.com/es/es/a/571293/" target="_blank">
    <rect x="120" y="657" width="160" height="78" class="comp-box-valve"/>
    <text x="200" y="675" class="comp-label">VPPM Proportional</text>
    <text x="200" y="690" class="comp-detail">VPPM-8L-L-1-G14</text>
    <text x="200" y="705" class="comp-detail">ASB, 0-10 bar, inlet max 11 bar</text>
    <text x="200" y="723" class="comp-detail">ref: 571293</text>
  </a>
  <!-- CK at VPPM ports -->
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="200" cy="657" r="5" class="ck-fitting"/></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="200" cy="735" r="5" class="ck-fitting"/></a>

  <!-- VPPM Exhaust (left side) -->
  <line x1="130" y1="696" x2="80" y2="696" class="tube-exhaust"/>
  <a xlink:href="https://www.festo.com/es/es/a/2316/" target="_blank">
    <rect x="40" y="684" width="40" height="25" class="silencer" rx="4"/>
    <text x="60" y="700" style="font-size:9px;fill:#555;text-anchor:middle;">U-1/4</text>
    <text x="60" y="720" class="ref-num" style="font-size:9px">2316</text>
  </a>

  <!-- EBS (right column, x=520) -->
  <a xlink:href="https://www.festo.com/es/es/a/8035174/" target="_blank">
    <rect x="440" y="657" width="160" height="78" class="comp-box-valve"/>
    <text x="520" y="675" class="comp-label">EBS Solenoid (N.O.)</text>
    <text x="520" y="690" class="comp-detail">VUVS-LT25 3/2-way</text>
    <text x="520" y="705" class="comp-detail">Emergency, 2.5-10 bar</text>
    <text x="520" y="723" class="comp-detail">ref: 8035174</text>
  </a>
  <!-- CK at EBS ports -->
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="520" cy="657" r="5" class="ck-fitting"/></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="520" cy="735" r="5" class="ck-fitting"/></a>

  <!-- EBS Exhaust blocked (no OR valve → plug prevents air escaping during VPPM regulation) -->
  <a xlink:href="https://www.festo.com/es/es/a/3569/" target="_blank">
    <rect x="601" y="680" width="32" height="18" rx="3" style="fill:#b0b0b0;stroke:#666;stroke-width:1.5;"/>
    <text x="617" y="692" style="font-size:8px;fill:#333;text-anchor:middle;font-weight:600;">B-1/4</text>
    <text x="617" y="707" class="ref-num" style="font-size:8px">3569</text>
  </a>

  <!-- ===== MERGE ===== -->

  <!-- Tube: VPPM out down to merge -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <polyline points="200,735 200,800 335,800 335,830" class="tube"/>
  </a>
  <!-- Tube: EBS out down to merge -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <polyline points="520,735 520,800 385,800 385,830" class="tube"/>
  </a>

  <!-- NPFC-T merge -->
  <a xlink:href="https://www.festo.com/es/es/a/8030236/" target="_blank">
    <rect x="325" y="830" width="70" height="55" class="npfc-t" rx="6"/>
    <text x="360" y="848" class="comp-label" style="font-size:11px">NPFC-T</text>
    <text x="360" y="861" class="comp-detail">3&#215;G1/4</text>
    <text x="360" y="873" class="comp-detail" style="font-size:9px;">ref: 8030236</text>
  </a>
  <!-- CK on merge ports -->
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="335" cy="830" r="4" class="ck-fitting"/><text x="320" y="825" class="ck-label">CK</text></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="385" cy="830" r="4" class="ck-fitting"/><text x="400" y="825" class="ck-label">CK</text></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="360" cy="885" r="4" class="ck-fitting"/></a>

  <!-- ===== ACTUATOR ===== -->

  <!-- Tube down + LCK elbow -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank"><line x1="360" y1="885" x2="360" y2="930" class="tube"/></a>
  <a xlink:href="https://www.festo.com/es/es/a/4469/" target="_blank">
    <circle cx="360" cy="920" r="6" style="fill:#ffcc80;stroke:#ef6c00;stroke-width:1.5;"/>
    <text x="378" y="918" class="ck-label" style="font-size:9px">LCK</text>
    <text x="378" y="930" class="ref-num" style="font-size:8px">4469</text>
  </a>

  <!-- Actuator -->
  <a xlink:href="https://www.festo.com/gb/en/a/8084714/" target="_blank">
    <rect x="285" y="940" width="150" height="70" class="comp-box-actuator"/>
    <text x="360" y="962" class="comp-label">Brake Actuator</text>
    <text x="360" y="976" class="comp-detail">ADN-S-50-45</text>
    <text x="360" y="990" class="comp-detail">Spring-return, G1/8, 0.4-10 bar</text>
    <text x="360" y="1006" class="comp-detail">ref: 8084714</text>
  </a>

  <!-- Actuator Exhaust down -->
  <line x1="360" y1="1010" x2="360" y2="1045" class="tube-exhaust"/>
  <a xlink:href="https://www.festo.com/es/es/a/2307/" target="_blank">
    <rect x="340" y="1045" width="40" height="25" class="silencer" rx="4"/>
    <text x="360" y="1061" style="font-size:9px;fill:#555;text-anchor:middle;">U-1/8</text>
    <text x="360" y="1082" class="ref-num" style="font-size:9px">2307</text>
  </a>

  </g>
</svg>
