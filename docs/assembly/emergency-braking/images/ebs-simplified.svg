<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 720 1350" width="720" height="1350">
  <style>
    text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
    .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
    .subtitle { font-size: 12px; fill: #555; }
    .comp-box { fill: #f5f5f5; stroke: #333; stroke-width: 1.5; rx: 6; }
    .comp-box-valve { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 1.8; rx: 6; }
    .comp-box-actuator { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.8; rx: 6; }
    .comp-box-sensor { fill: #e6f4ea; stroke: #188038; stroke-width: 1.8; rx: 6; }
    .comp-label { font-size: 12px; font-weight: 600; fill: #222; text-anchor: middle; }
    .comp-detail { font-size: 10px; fill: #555; text-anchor: middle; }
    .ref-num { font-size: 11px; font-weight: bold; fill: #c5221f; text-anchor: middle; }
    .port-label { font-size: 9px; fill: #666; text-anchor: middle; }
    .tube { fill: none; stroke: #1a73e8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .tube-exhaust { fill: none; stroke: #999; stroke-width: 2; stroke-dasharray: 6,3; stroke-linecap: round; }
    .ck-fitting { fill: #fdd835; stroke: #f9a825; stroke-width: 1.5; }
    .ck-label { font-size: 8px; fill: #795548; text-anchor: middle; font-weight: 600; }
    .silencer { fill: #e0e0e0; stroke: #757575; stroke-width: 1.5; }
    .npfc-t { fill: #fff9c4; stroke: #f9a825; stroke-width: 2; }
    .legend-box { fill: #fafafa; stroke: #ccc; stroke-width: 1; rx: 4; }
    a:hover .comp-box, a:hover .comp-box-valve, a:hover .comp-box-actuator, a:hover .comp-box-sensor {
      stroke-width: 3; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }
    a:hover .tube { stroke-width: 4; }
    a:hover .ck-fitting { stroke-width: 2.5; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.3)); }
  </style>

  <rect width="720" height="1350" fill="#fefefe" rx="10"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" class="title">EBS Pneumatic Circuit &#8212; Simplified Design</text>
  <text x="360" y="46" text-anchor="middle" class="subtitle">VPPM + EBS in parallel &#8594; actuator. No ASB valve, no OR valve.</text>

  <!-- ===== SUPPLY CHAIN (vertical, centered at x=360) ===== -->

  <!-- Compressor + Tank -->
  <g>
    <rect x="285" y="70" width="150" height="55" class="comp-box"/>
    <text x="360" y="93" class="comp-label">Compressor + Tank</text>
    <text x="360" y="107" class="comp-detail">VEVOR 12V, 6L, 90-120 psi</text>
  </g>

  <!-- Tube down + CK -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank"><line x1="360" y1="125" x2="360" y2="165" class="tube"/></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="360" cy="140" r="5" class="ck-fitting"/><text x="375" y="144" class="ck-label">CK</text></a>

  <!-- PS1 -->
  <a xlink:href="https://www.festo.com/es/es/a/567465/" target="_blank">
    <rect x="285" y="165" width="150" height="50" class="comp-box-sensor"/>
    <text x="360" y="185" class="comp-label">Pressure Sensor</text>
    <text x="360" y="198" class="comp-detail">(tank side) SDE5, 0-10 bar</text>
    <text x="445" y="180" class="ref-num">567465</text>
  </a>

  <!-- Tube down + CK -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank"><line x1="360" y1="215" x2="360" y2="255" class="tube"/></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="360" cy="230" r="5" class="ck-fitting"/><text x="375" y="234" class="ck-label">CK</text></a>

  <!-- Ball Valve -->
  <g>
    <rect x="295" y="255" width="130" height="45" class="comp-box"/>
    <text x="360" y="275" class="comp-label">Ball Valve</text>
    <text x="360" y="288" class="comp-detail">(manual isolation)</text>
  </g>

  <!-- Tube down + CK -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank"><line x1="360" y1="300" x2="360" y2="340" class="tube"/></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="360" cy="315" r="5" class="ck-fitting"/><text x="375" y="319" class="ck-label">CK</text></a>

  <!-- Regulator -->
  <a xlink:href="https://www.festo.com/es/es/a/527690/" target="_blank">
    <rect x="275" y="340" width="170" height="55" class="comp-box"/>
    <text x="360" y="360" class="comp-label">Regulator</text>
    <text x="360" y="374" class="comp-detail">MS4-LR-1/4-D7-AD10, 0.5-12 bar</text>
    <text x="360" y="387" class="comp-detail">&#9888; Never set above 10 bar</text>
    <text x="455" y="352" class="ref-num">527690</text>
  </a>

  <!-- Tube down + CK -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank"><line x1="360" y1="395" x2="360" y2="435" class="tube"/></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="360" cy="410" r="5" class="ck-fitting"/><text x="375" y="414" class="ck-label">CK</text></a>

  <!-- PS2 -->
  <a xlink:href="https://www.festo.com/es/es/a/567465/" target="_blank">
    <rect x="285" y="435" width="150" height="50" class="comp-box-sensor"/>
    <text x="360" y="455" class="comp-label">Pressure Sensor</text>
    <text x="360" y="468" class="comp-detail">(regulated) SDE5, 0-10 bar</text>
    <text x="445" y="450" class="ref-num">567465</text>
  </a>

  <!-- Tube down + CK -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank"><line x1="360" y1="485" x2="360" y2="520" class="tube"/></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="360" cy="498" r="5" class="ck-fitting"/><text x="375" y="502" class="ck-label">CK</text></a>

  <!-- ===== NPFC-T SPLIT ===== -->
  <a xlink:href="https://www.festo.com/es/es/a/8030236/" target="_blank">
    <rect x="325" y="520" width="70" height="45" class="npfc-t" rx="6"/>
    <text x="360" y="540" class="comp-label" style="font-size:11px">NPFC-T</text>
    <text x="360" y="553" class="comp-detail">3&#215;G1/4</text>
    <text x="405" y="533" class="ref-num" style="font-size:10px">8030236</text>
  </a>
  <!-- CK on each NPFC-T port -->
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="335" cy="565" r="4" class="ck-fitting"/><text x="320" y="575" class="ck-label">CK</text></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="385" cy="565" r="4" class="ck-fitting"/><text x="400" y="575" class="ck-label">CK</text></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="360" cy="520" r="4" class="ck-fitting"/></a>

  <!-- ===== PARALLEL PATHS ===== -->

  <!-- Tube: split left to VPPM -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <polyline points="335,565 335,590 200,590 200,630" class="tube"/>
  </a>
  <!-- Tube: split right to EBS -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <polyline points="385,565 385,590 520,590 520,630" class="tube"/>
  </a>

  <!-- VPPM (left column, x=200) -->
  <a xlink:href="https://www.festo.com/es/es/a/571293/" target="_blank">
    <rect x="120" y="630" width="160" height="65" class="comp-box-valve"/>
    <text x="200" y="650" class="comp-label">VPPM Proportional</text>
    <text x="200" y="664" class="comp-detail">VPPM-8L-L-1-G14</text>
    <text x="200" y="678" class="comp-detail">ASB, 0-10 bar, inlet max 11 bar</text>
    <text x="200" y="623" class="ref-num">571293</text>
  </a>
  <!-- CK at VPPM ports -->
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="200" cy="630" r="5" class="ck-fitting"/></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="200" cy="695" r="5" class="ck-fitting"/></a>

  <!-- VPPM Exhaust (left side) -->
  <line x1="130" y1="662" x2="80" y2="662" class="tube-exhaust"/>
  <a xlink:href="https://www.festo.com/es/es/a/2316/" target="_blank">
    <rect x="40" y="650" width="40" height="25" class="silencer" rx="4"/>
    <text x="60" y="666" style="font-size:9px;fill:#555;text-anchor:middle;">U-1/4</text>
    <text x="60" y="686" class="ref-num" style="font-size:9px">2316</text>
  </a>

  <!-- EBS (right column, x=520) -->
  <a xlink:href="https://www.festo.com/es/es/a/8035174/" target="_blank">
    <rect x="440" y="630" width="160" height="65" class="comp-box-valve"/>
    <text x="520" y="650" class="comp-label">EBS Solenoid (N.O.)</text>
    <text x="520" y="664" class="comp-detail">VUVS-LT25 3/2-way</text>
    <text x="520" y="678" class="comp-detail">Emergency, 2.5-10 bar</text>
    <text x="520" y="623" class="ref-num">8035174</text>
  </a>
  <!-- CK at EBS ports -->
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="520" cy="630" r="5" class="ck-fitting"/></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="520" cy="695" r="5" class="ck-fitting"/></a>

  <!-- EBS Exhaust (right side) -->
  <line x1="600" y1="662" x2="650" y2="662" class="tube-exhaust"/>
  <a xlink:href="https://www.festo.com/es/es/a/2316/" target="_blank">
    <rect x="640" y="650" width="40" height="25" class="silencer" rx="4"/>
    <text x="660" y="666" style="font-size:9px;fill:#555;text-anchor:middle;">U-1/4</text>
    <text x="660" y="686" class="ref-num" style="font-size:9px">2316</text>
  </a>

  <!-- ===== MERGE ===== -->

  <!-- Tube: VPPM out down to merge -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <polyline points="200,695 200,760 335,760 335,790" class="tube"/>
  </a>
  <!-- Tube: EBS out down to merge -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <polyline points="520,695 520,760 385,760 385,790" class="tube"/>
  </a>

  <!-- NPFC-T merge -->
  <a xlink:href="https://www.festo.com/es/es/a/8030236/" target="_blank">
    <rect x="325" y="790" width="70" height="45" class="npfc-t" rx="6"/>
    <text x="360" y="810" class="comp-label" style="font-size:11px">NPFC-T</text>
    <text x="360" y="823" class="comp-detail">3&#215;G1/4</text>
    <text x="405" y="803" class="ref-num" style="font-size:10px">8030236</text>
  </a>
  <!-- CK on merge ports -->
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="335" cy="790" r="4" class="ck-fitting"/><text x="320" y="785" class="ck-label">CK</text></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="385" cy="790" r="4" class="ck-fitting"/><text x="400" y="785" class="ck-label">CK</text></a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank"><circle cx="360" cy="835" r="4" class="ck-fitting"/></a>

  <!-- ===== ACTUATOR ===== -->

  <!-- Tube down + LCK elbow -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank"><line x1="360" y1="835" x2="360" y2="880" class="tube"/></a>
  <a xlink:href="https://www.festo.com/es/es/a/4469/" target="_blank">
    <circle cx="360" cy="870" r="6" style="fill:#ffcc80;stroke:#ef6c00;stroke-width:1.5;"/>
    <text x="378" y="868" class="ck-label" style="font-size:9px">LCK</text>
    <text x="378" y="880" class="ref-num" style="font-size:8px">4469</text>
  </a>

  <!-- Actuator -->
  <a xlink:href="https://www.festo.com/gb/en/a/8084714/" target="_blank">
    <rect x="285" y="890" width="150" height="70" class="comp-box-actuator"/>
    <text x="360" y="912" class="comp-label">Brake Actuator</text>
    <text x="360" y="926" class="comp-detail">ADN-S-50-45</text>
    <text x="360" y="940" class="comp-detail">Spring-return, G1/8, 0.4-10 bar</text>
    <text x="445" y="905" class="ref-num">8084714</text>
  </a>

  <!-- Actuator Exhaust down -->
  <line x1="360" y1="960" x2="360" y2="995" class="tube-exhaust"/>
  <a xlink:href="https://www.festo.com/es/es/a/2307/" target="_blank">
    <rect x="340" y="995" width="40" height="25" class="silencer" rx="4"/>
    <text x="360" y="1011" style="font-size:9px;fill:#555;text-anchor:middle;">U-1/8</text>
    <text x="360" y="1032" class="ref-num" style="font-size:9px">2307</text>
  </a>

  <!-- ===== LEGEND ===== -->
  <rect x="30" y="1070" width="660" height="115" class="legend-box"/>
  <text x="50" y="1092" style="font-size:13px;font-weight:bold;fill:#333;">Legend</text>

  <line x1="50" y1="1110" x2="90" y2="1110" class="tube"/>
  <text x="100" y="1114" style="font-size:11px;fill:#444;">Pneumatic tube (PUN-H 6mm, 197384) &#8212; click to view</text>

  <circle cx="70" cy="1132" r="5" class="ck-fitting"/>
  <text x="100" y="1136" style="font-size:11px;fill:#444;">CK-1/4-PK-4 compression fitting (2029) &#8212; click to view</text>

  <rect x="58" y="1148" width="20" height="14" class="npfc-t" rx="2"/>
  <text x="100" y="1160" style="font-size:11px;fill:#444;">NPFC-T-3G14-F threaded T-adapter (8030236)</text>

  <text x="70" y="1182" class="ref-num" style="font-size:11px;">123456</text>
  <text x="110" y="1182" style="font-size:11px;fill:#444;">= Festo article number (click to open product page)</text>

  <line x1="400" y1="1108" x2="440" y2="1108" class="tube-exhaust"/>
  <text x="450" y="1112" style="font-size:11px;fill:#444;">Exhaust path</text>

  <rect x="412" y="1124" width="16" height="12" class="silencer" rx="2"/>
  <text x="450" y="1134" style="font-size:11px;fill:#444;">Silencer (2316 G1/4 or 2307 G1/8)</text>

  <text x="400" y="1160" style="font-size:11px;fill:#444;font-style:italic;">All ports G1/4 unless noted. Tubing: 6mm OD / 4mm ID.</text>

</svg>
