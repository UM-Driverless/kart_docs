<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1600 780" width="1600" height="780">
  <style>
    text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
    .title { font-size: 20px; font-weight: bold; fill: #1a1a1a; }
    .subtitle { font-size: 13px; fill: #555; }
    .comp-box { fill: #f5f5f5; stroke: #333; stroke-width: 1.5; rx: 6; }
    .comp-box-valve { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 1.8; rx: 6; }
    .comp-box-actuator { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.8; rx: 6; }
    .comp-box-sensor { fill: #e6f4ea; stroke: #188038; stroke-width: 1.8; rx: 6; }
    .comp-box-shuttle { fill: #f3e5f5; stroke: #7b1fa2; stroke-width: 1.8; rx: 6; }
    .comp-label { font-size: 11px; font-weight: 600; fill: #222; text-anchor: middle; }
    .comp-detail { font-size: 9px; fill: #555; text-anchor: middle; }
    .ref-num { font-size: 10px; font-weight: bold; fill: #c5221f; text-anchor: middle; }
    .port-label { font-size: 8px; fill: #666; text-anchor: middle; }
    .tube { fill: none; stroke: #1a73e8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .tube-exhaust { fill: none; stroke: #999; stroke-width: 2; stroke-dasharray: 6,3; stroke-linecap: round; }
    .ck-fitting { fill: #fdd835; stroke: #f9a825; stroke-width: 1.5; }
    .ck-label { font-size: 7px; fill: #795548; text-anchor: middle; font-weight: 600; }
    .silencer { fill: #e0e0e0; stroke: #757575; stroke-width: 1.5; }
    .silencer-label { font-size: 9px; fill: #555; text-anchor: middle; }
    .npfc-t { fill: #fff9c4; stroke: #f9a825; stroke-width: 2; }
    .legend-box { fill: #fafafa; stroke: #ccc; stroke-width: 1; rx: 4; }
    .note-box { fill: #fff3e0; stroke: #ff9800; stroke-width: 1; rx: 4; }
    a:hover .comp-box, a:hover .comp-box-valve, a:hover .comp-box-actuator,
    a:hover .comp-box-sensor, a:hover .comp-box-shuttle {
      stroke-width: 3; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }
    a:hover .tube { stroke-width: 4; }
    a:hover .ck-fitting { stroke-width: 2.5; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.3)); }
  </style>

  <!-- Background -->
  <rect width="1600" height="780" fill="#fefefe" rx="12"/>

  <!-- Title -->
  <text x="800" y="30" text-anchor="middle" class="title">EBS Pneumatic Circuit &#8212; Full Design (with ASB isolation + OR valve)</text>
  <text x="800" y="48" text-anchor="middle" class="subtitle">ASB valve isolates VPPM supply. OR valve merges EBS + VPPM outputs. Maximum redundancy.</text>

  <!-- ========== SUPPLY LINE (y~130) ========== -->

  <!-- Compressor + Tank -->
  <g>
    <rect x="30" y="100" width="120" height="60" class="comp-box"/>
    <text x="90" y="124" class="comp-label">Compressor</text>
    <text x="90" y="137" class="comp-detail">+ 6L Tank (VEVOR)</text>
    <text x="90" y="150" class="comp-detail">12V, 90-120 psi</text>
  </g>

  <!-- Tube: Compressor → PS1 -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <line x1="150" y1="130" x2="190" y2="130" class="tube"/>
  </a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank">
    <circle cx="160" cy="130" r="5" class="ck-fitting"/>
    <text x="160" y="145" class="ck-label">CK</text>
  </a>

  <!-- PS1 - Pressure Sensor (tank side) -->
  <a xlink:href="https://www.festo.com/es/es/a/567465/" target="_blank">
    <rect x="190" y="107" width="100" height="46" class="comp-box-sensor"/>
    <text x="240" y="126" class="comp-label">Pressure Sensor</text>
    <text x="240" y="138" class="comp-detail">(tank side) SDE5</text>
    <text x="240" y="100" class="ref-num">567465</text>
  </a>

  <!-- Tube: PS1 → Ball Valve -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <line x1="290" y1="130" x2="350" y2="130" class="tube"/>
  </a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank">
    <circle cx="310" cy="130" r="5" class="ck-fitting"/>
    <text x="310" y="145" class="ck-label">CK</text>
  </a>

  <!-- Manual Ball Valve -->
  <g>
    <rect x="350" y="107" width="90" height="46" class="comp-box"/>
    <text x="395" y="126" class="comp-label">Ball Valve</text>
    <text x="395" y="138" class="comp-detail">(manual isolation)</text>
  </g>

  <!-- Tube: Ball Valve → Regulator -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <line x1="440" y1="130" x2="500" y2="130" class="tube"/>
  </a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank">
    <circle cx="460" cy="130" r="5" class="ck-fitting"/>
    <text x="460" y="145" class="ck-label">CK</text>
  </a>

  <!-- Regulator -->
  <a xlink:href="https://www.festo.com/es/es/a/527690/" target="_blank">
    <rect x="500" y="100" width="120" height="60" class="comp-box"/>
    <text x="560" y="122" class="comp-label">Regulator</text>
    <text x="560" y="135" class="comp-detail">MS4-LR-1/4-D7-AD10</text>
    <text x="560" y="148" class="comp-detail">0.5-12 bar</text>
    <text x="560" y="92" class="ref-num">527690</text>
  </a>

  <!-- Tube: Regulator → PS2 -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <line x1="620" y1="130" x2="680" y2="130" class="tube"/>
  </a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank">
    <circle cx="640" cy="130" r="5" class="ck-fitting"/>
    <text x="640" y="145" class="ck-label">CK</text>
  </a>

  <!-- PS2 - Pressure Sensor (regulated side) -->
  <a xlink:href="https://www.festo.com/es/es/a/567465/" target="_blank">
    <rect x="680" y="107" width="100" height="46" class="comp-box-sensor"/>
    <text x="730" y="126" class="comp-label">Pressure Sensor</text>
    <text x="730" y="138" class="comp-detail">(regulated) SDE5</text>
    <text x="730" y="100" class="ref-num">567465</text>
  </a>

  <!-- Tube: PS2 → NPFC-T split -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <line x1="780" y1="130" x2="840" y2="130" class="tube"/>
  </a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank">
    <circle cx="800" cy="130" r="5" class="ck-fitting"/>
    <text x="800" y="145" class="ck-label">CK</text>
  </a>

  <!-- ========== NPFC-T SPLIT ========== -->
  <a xlink:href="https://www.festo.com/es/es/a/8030236/" target="_blank">
    <rect x="840" y="105" width="60" height="50" class="npfc-t" rx="6"/>
    <text x="870" y="127" class="comp-label" style="font-size:10px">NPFC-T</text>
    <text x="870" y="140" class="comp-detail">3&#215;G1/4</text>
    <text x="870" y="97" class="ref-num">8030236</text>
  </a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank">
    <circle cx="850" cy="155" r="4" class="ck-fitting"/>
    <text x="838" y="166" class="ck-label">CK</text>
  </a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank">
    <circle cx="890" cy="155" r="4" class="ck-fitting"/>
    <text x="902" y="166" class="ck-label">CK</text>
  </a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank">
    <circle cx="870" cy="105" r="4" class="ck-fitting"/>
    <text x="870" y="98" class="ck-label">CK</text>
  </a>

  <!-- ========== UPPER PATH: ASB Valve → VPPM (y~250) ========== -->

  <!-- Tube: NPFC-T split → up → ASB valve -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <polyline points="870,105 870,80 930,80 930,260 960,260" class="tube"/>
  </a>

  <!-- ASB Isolation Valve (Normally Closed - energized = open) -->
  <a xlink:href="https://www.festo.com/es/es/a/8035167/" target="_blank">
    <rect x="960" y="230" width="130" height="60" class="comp-box-valve"/>
    <text x="1025" y="250" class="comp-label">ASB Valve (N.C.)</text>
    <text x="1025" y="263" class="comp-detail">VUVS-LT25 3/2-way</text>
    <text x="1025" y="276" class="comp-detail">Isolates VPPM supply</text>
    <text x="1025" y="222" class="ref-num">8035167</text>
    <text x="968" y="243" class="port-label">1</text>
    <text x="1082" y="243" class="port-label">2</text>
    <text x="1025" y="298" class="port-label">3 (exhaust)</text>
  </a>
  <!-- CK at ASB ports -->
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank">
    <circle cx="960" cy="260" r="5" class="ck-fitting"/>
  </a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank">
    <circle cx="1090" cy="260" r="5" class="ck-fitting"/>
  </a>

  <!-- ASB Exhaust → Silencer 2316 -->
  <line x1="1025" y1="290" x2="1025" y2="330" class="tube-exhaust"/>
  <a xlink:href="https://www.festo.com/es/es/a/2316/" target="_blank">
    <rect x="1005" y="330" width="40" height="30" class="silencer" rx="4"/>
    <text x="1025" y="349" class="silencer-label" style="font-size:8px">U-1/4</text>
    <text x="1025" y="370" class="ref-num" style="font-size:9px">2316</text>
  </a>

  <!-- Tube: ASB out → VPPM in -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <line x1="1090" y1="260" x2="1130" y2="260" class="tube"/>
  </a>

  <!-- VPPM Proportional Valve -->
  <a xlink:href="https://www.festo.com/es/es/a/571293/" target="_blank">
    <rect x="1130" y="230" width="130" height="60" class="comp-box-valve"/>
    <text x="1195" y="250" class="comp-label">VPPM Proportional</text>
    <text x="1195" y="263" class="comp-detail">VPPM-8L-L-1-G14</text>
    <text x="1195" y="276" class="comp-detail">ASB &#8212; 0-10 bar</text>
    <text x="1195" y="222" class="ref-num">571293</text>
    <text x="1138" y="243" class="port-label">1</text>
    <text x="1252" y="243" class="port-label">2</text>
    <text x="1195" y="298" class="port-label">3 (exhaust)</text>
  </a>
  <!-- CK at VPPM ports -->
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank">
    <circle cx="1130" cy="260" r="5" class="ck-fitting"/>
  </a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank">
    <circle cx="1260" cy="260" r="5" class="ck-fitting"/>
  </a>

  <!-- VPPM Exhaust → Silencer 2316 -->
  <line x1="1195" y1="290" x2="1195" y2="330" class="tube-exhaust"/>
  <a xlink:href="https://www.festo.com/es/es/a/2316/" target="_blank">
    <rect x="1175" y="330" width="40" height="30" class="silencer" rx="4"/>
    <text x="1195" y="349" class="silencer-label" style="font-size:8px">U-1/4</text>
    <text x="1195" y="370" class="ref-num" style="font-size:9px">2316</text>
  </a>

  <!-- ========== LOWER PATH: EBS (y~460) ========== -->

  <!-- Tube: NPFC-T split → down → EBS -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <polyline points="870,155 870,180 920,180 920,460 960,460" class="tube"/>
  </a>

  <!-- EBS Solenoid Valve (Normally Open) -->
  <a xlink:href="https://www.festo.com/es/es/a/8035174/" target="_blank">
    <rect x="960" y="430" width="130" height="60" class="comp-box-valve"/>
    <text x="1025" y="450" class="comp-label">EBS Solenoid (N.O.)</text>
    <text x="1025" y="463" class="comp-detail">VUVS-LT25 3/2-way</text>
    <text x="1025" y="476" class="comp-detail">Emergency Braking</text>
    <text x="1025" y="422" class="ref-num">8035174</text>
    <text x="968" y="443" class="port-label">1</text>
    <text x="1082" y="443" class="port-label">2</text>
    <text x="1025" y="498" class="port-label">3 (exhaust)</text>
  </a>
  <!-- CK at EBS ports -->
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank">
    <circle cx="960" cy="460" r="5" class="ck-fitting"/>
  </a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank">
    <circle cx="1090" cy="460" r="5" class="ck-fitting"/>
  </a>

  <!-- EBS Exhaust → Silencer 2316 -->
  <line x1="1025" y1="490" x2="1025" y2="530" class="tube-exhaust"/>
  <a xlink:href="https://www.festo.com/es/es/a/2316/" target="_blank">
    <rect x="1005" y="530" width="40" height="30" class="silencer" rx="4"/>
    <text x="1025" y="549" class="silencer-label" style="font-size:8px">U-1/4</text>
    <text x="1025" y="570" class="ref-num" style="font-size:9px">2316</text>
  </a>

  <!-- ========== OR VALVE (Shuttle) ========== -->

  <!-- Tube: VPPM out → OR valve port B -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <polyline points="1260,260 1300,260 1300,345 1330,345" class="tube"/>
  </a>

  <!-- Tube: EBS out → OR valve port A -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <polyline points="1090,460 1300,460 1300,375 1330,375" class="tube"/>
  </a>

  <!-- OR Valve / Shuttle Valve -->
  <a xlink:href="https://www.festo.com/es/es/a/6682/" target="_blank">
    <rect x="1330" y="335" width="80" height="55" class="comp-box-shuttle"/>
    <text x="1370" y="355" class="comp-label">OR Valve</text>
    <text x="1370" y="368" class="comp-detail">OS-1/4-B (shuttle)</text>
    <text x="1370" y="381" class="comp-detail">Merges outputs</text>
    <text x="1370" y="327" class="ref-num">6682</text>
    <text x="1338" y="348" class="port-label">A</text>
    <text x="1338" y="385" class="port-label">B</text>
    <text x="1402" y="367" class="port-label">out</text>
  </a>
  <!-- CK at OR valve ports -->
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank">
    <circle cx="1330" cy="345" r="4" class="ck-fitting"/>
  </a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank">
    <circle cx="1330" cy="375" r="4" class="ck-fitting"/>
  </a>
  <a xlink:href="https://www.festo.com/es/es/a/2029/" target="_blank">
    <circle cx="1410" cy="362" r="4" class="ck-fitting"/>
  </a>

  <!-- ========== ACTUATOR ========== -->

  <!-- Tube: OR valve out → LCK elbow → Actuator -->
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <line x1="1410" y1="362" x2="1440" y2="362" class="tube"/>
  </a>
  <!-- LCK elbow fitting -->
  <a xlink:href="https://www.festo.com/es/es/a/4469/" target="_blank">
    <circle cx="1440" cy="362" r="6" class="ck-fitting" style="fill:#ffcc80;stroke:#ef6c00;"/>
    <text x="1440" y="352" class="ck-label" style="font-size:8px">LCK</text>
    <text x="1440" y="378" class="ref-num" style="font-size:8px">4469</text>
  </a>
  <a xlink:href="https://www.festo.com/es/es/a/197384/" target="_blank">
    <line x1="1446" y1="362" x2="1470" y2="362" class="tube"/>
  </a>

  <!-- Actuator -->
  <a xlink:href="https://www.festo.com/gb/en/a/8084714/" target="_blank">
    <rect x="1470" y="325" width="120" height="75" class="comp-box-actuator"/>
    <text x="1530" y="349" class="comp-label">Brake Actuator</text>
    <text x="1530" y="362" class="comp-detail">ADN-S-50-45</text>
    <text x="1530" y="375" class="comp-detail">Spring-return, G1/8</text>
    <text x="1530" y="388" class="comp-detail">0.4-10 bar</text>
    <text x="1530" y="317" class="ref-num">8084714</text>
    <text x="1478" y="338" class="port-label">1 (in)</text>
    <text x="1578" y="338" class="port-label">2 (exh)</text>
  </a>

  <!-- Actuator Exhaust → Silencer 2307 (G1/8) -->
  <line x1="1570" y1="400" x2="1570" y2="435" class="tube-exhaust"/>
  <a xlink:href="https://www.festo.com/es/es/a/2307/" target="_blank">
    <rect x="1550" y="435" width="40" height="30" class="silencer" rx="4"/>
    <text x="1570" y="454" class="silencer-label" style="font-size:8px">U-1/8</text>
    <text x="1570" y="475" class="ref-num" style="font-size:9px">2307</text>
  </a>

  <!-- ========== COIL + CONNECTORS NOTE ========== -->
  <rect x="960" y="590" width="340" height="55" class="note-box"/>
  <text x="975" y="608" style="font-size:10px;font-weight:bold;fill:#e65100;">Electrical connections (not shown in pneumatic diagram):</text>
  <text x="975" y="622" style="font-size:9px;fill:#555;">ASB coil: 8030801 + connector MSSD-EB: 151687</text>
  <text x="975" y="634" style="font-size:9px;fill:#555;">EBS coil: (reuse existing) + connector MSSD-EB: 151687</text>

  <!-- ========== LEGEND ========== -->
  <rect x="30" y="660" width="620" height="100" class="legend-box"/>
  <text x="45" y="680" style="font-size:12px;font-weight:bold;fill:#333;">Legend</text>

  <line x1="45" y1="700" x2="80" y2="700" class="tube"/>
  <text x="90" y="704" style="font-size:10px;fill:#444;">Pneumatic tube (PUN-H 6mm, 197384) &#8212; click to view</text>

  <circle cx="62" cy="720" r="5" class="ck-fitting"/>
  <text x="90" y="724" style="font-size:10px;fill:#444;">CK-1/4-PK-4 compression fitting (2029) &#8212; click to view</text>

  <rect x="50" y="736" width="20" height="14" class="npfc-t" rx="2"/>
  <text x="90" y="748" style="font-size:10px;fill:#444;">NPFC-T-3G14-F threaded T-adapter (8030236) &#8212; replaces TCK-1/4</text>

  <text x="62" y="768" class="ref-num" style="font-size:10px;">123456</text>
  <text x="105" y="768" style="font-size:10px;fill:#444;">= Festo article number (click component to open Festo page)</text>

  <line x1="380" y1="698" x2="420" y2="698" class="tube-exhaust"/>
  <text x="430" y="702" style="font-size:10px;fill:#444;">Exhaust path</text>

  <rect x="392" y="712" width="16" height="12" class="silencer" rx="2"/>
  <text x="430" y="722" style="font-size:10px;fill:#444;">Silencer (2316 G1/4 or 2307 G1/8)</text>

  <rect x="388" y="735" width="24" height="14" class="comp-box-shuttle" style="stroke-width:1;" rx="2"/>
  <text x="430" y="746" style="font-size:10px;fill:#444;">OR / Shuttle valve (merges parallel outputs)</text>

  <text x="380" y="768" style="font-size:10px;fill:#444;font-style:italic;">All pneumatic ports G1/4 unless noted. Tubing: 6mm OD / 4mm ID.</text>

</svg>
