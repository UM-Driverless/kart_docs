site_name: Driverless Kart Documentation
theme:
  name: material
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
nav:
  - Home: index.md
  - BOM: bom/index.md
  - Assembly:
      - Powertrain:
          - Overview: assemblies/powertrain/index.md
          - Motor: assemblies/powertrain/motor.md
          - Transmission: assemblies/powertrain/transmission.md
          - Throttle Pedal: assemblies/powertrain/throttle-pedal.md
          - Fasteners: assemblies/powertrain/fasteners.md
      - Steering:
          - Overview: assemblies/steering/index.md
          - Motor & Coupling: assemblies/steering/index.md
          - H-bridge: assemblies/steering/h-bridge.md
          - Angle Sensor: assemblies/steering/sensor/index.md
          - Fasteners: assemblies/steering/fasteners.md
      - Electronics:
          - Microcontroller: assemblies/electronics/microcontroller.md
          - Computer: assemblies/electronics/computer.md
          - DAC: assemblies/electronics/dac.md
          - Wiring: assemblies/electronics/wiring.md
      - Power:
          - Battery: assemblies/power/battery.md
      - Sensors:
          - Camera: assemblies/sensors/camera.md
  - Assembly Instructions: assembly/index.md
  - Pneumatics: pneumatics/index.md
  - Hydraulics: hydraulics/index.md
  - Software: software/index.md
  - FAQ: faq.md
  - Contact: contact.md
repo_url: https://github.com/um-driverless/kart_docs
edit_uri: edit/main/docs/
plugins:
  - search
  - exporter:
      enabled: !ENV [EXPORT_PDF, false] # ← only runs when EXPORT_PDF=true
      formats:
        pdf:
          pages:
            enabled: false # keep only the book-size PDF
          aggregator:
            enabled: true
            output: kart-documentation.pdf

hooks:
  - generate_llm_hook.py
