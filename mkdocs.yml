site_name: Driverless Kart Documentation
theme:
  name: material
  features:
    - navigation.indexes
# Part pages under /p/ are reached by QR scan or direct URL, intentionally not in nav.
not_in_nav: |
  /p/**

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - About: about.md
  - Build Journey: build-journey/index.md
  - BOM:
      - bom/index.md
      - Full BOM (shareable): bom/full.md
  - Tools: tools/index.md
  - Assembly:
      - assembly/index.md
      - Chassis: assembly/chassis/index.md
      - Powertrain:
          - assembly/powertrain/index.md
          - Motor: assembly/powertrain/motor.md
          - Transmission: assembly/powertrain/transmission.md
          - Throttle Pedal: assembly/powertrain/throttle-pedal.md
          - Fasteners: assembly/powertrain/fasteners.md
      - Steering:
          - assembly/steering/index.md
          - Reducer: assembly/steering/reducer.md
          - Alternative reducers:
              - assembly/steering/alternatives/index.md
              - Cycloidal: assembly/steering/alternatives/cycloidal.md
              - Folded compound train: assembly/steering/alternatives/folded-compound-gear-train.md
          - Motor options: assembly/steering/motor-options.md
          - H-bridge: assembly/steering/h-bridge.md
          - Angle Sensor: assembly/steering/sensor/index.md
          - Fasteners: assembly/steering/fasteners.md
          - Previous designs: assembly/steering/previous-designs.md
      - Electronics:
          - Wiring: assembly/electronics/wiring.md
          - Kart Medulla (ESP32-S3):
              - assembly/electronics/kart-medulla/index.md
              - Firmware: assembly/electronics/kart-medulla/firmware.md
              - Legacy wiring (classic ESP32): assembly/electronics/kart-medulla/legacy-wiring.md
          - Computer: assembly/electronics/computer.md
          - Orin Setup: assembly/electronics/orin-setup.md
          - Net Naming: assembly/electronics/net-naming.md
          - Power:
              - Battery: assembly/electronics/power/battery.md
      - Sensors:
          - Camera: assembly/sensors/camera.md
          - Wheel Sensor (legacy): assembly/sensors/wheel-sensor-legacy.md
      - Pneumatic Braking:
          - assembly/pneumatic-braking/index.md
          - BOM: assembly/pneumatic-braking/bom.md
      - Hydraulics: hydraulics/index.md
  - Software:
      - software/index.md
      - State Machine: software/state_machine.md
      - Dashboard: software/dashboard.md
      - 2024 — Python: software/legacy.md
      - 2025 — ROS 2:
          - software/ros2/index.md
          - Getting Started: software/ros2/getting-started.md
          - Architecture: software/ros2/architecture.md
          - Packages: software/ros2/packages.md
          - BMS (battery node): software/ros2/bms.md
          - Simulation: software/ros2/simulation.md
          - Performance: software/ros2/performance.md
  - Scan: scan.md
  - FAQ: faq.md
  - Credits: credits.md
  - Contact: contact.md
repo_url: https://github.com/um-driverless/kart-docs
edit_uri: edit/main/docs/
plugins:
  - search
  - exporter:
      enabled: !ENV [EXPORT_PDF, false] # ← only runs when EXPORT_PDF=true
      formats:
        pdf:
          pages:
            enabled: false # keep only the book-size PDF
          aggregator:
            enabled: true
            output: kart-documentation.pdf

hooks:
  - generate_llm_hook.py
  - generate_bom_hook.py
  - generate_wiring_hook.py

extra_css:
  - stylesheets/bom.css
